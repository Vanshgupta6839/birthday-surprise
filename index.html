<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Darling ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);
overflow:hidden;
}

.container{
text-align:center;
color:white;
padding:20px;
z-index:10;
}

h1{
font-size:4rem;
margin-bottom:20px;
animation:glow 2s infinite alternate;
}

p{
font-size:1.3rem;
margin-bottom:40px;
opacity:.9;
}

button{
padding:15px 40px;
font-size:18px;
border:none;
border-radius:50px;
cursor:pointer;
background:#ff4da6;
color:white;
box-shadow:0 0 20px #ff4da6;
transition:.3s;
}

button:hover{
transform:scale(1.1);
}

@keyframes glow{
from{
text-shadow:0 0 10px #ff4da6;
}
to{
text-shadow:0 0 30px #ff4da6;
}
}

.stars{
position:absolute;
width:100%;
height:100%;
top:0;
left:0;
overflow:hidden;
}

.star{
position:absolute;
width:3px;
height:3px;
background:white;
border-radius:50%;
animation:twinkle 3s infinite;
}

@keyframes twinkle{
0%,100%{
opacity:.2;
}
50%{
opacity:1;
}
}

</style>
</head>

<body>

<div class="stars" id="stars"></div>

<div class="container">

<h1>❤️ Hey Darling ❤️</h1>

<p>
Someone Special Made Something For You ✨
</p>

<button id="enterBtn">
Enter →
</button>

</div>

<script>

// Enter Button

document.getElementById("enterBtn").addEventListener("click", function(){

window.location.href = "gift.html";

});

// Stars

const stars=document.getElementById("stars");

for(let i=0;i<100;i++){

let star=document.createElement("div");

star.classList.add("star");

star.style.left=Math.random()*100+"%";
star.style.top=Math.random()*100+"%";

star.style.animationDelay=Math.random()*3+"s";

stars.appendChild(star);

}

</script>

</body>
</html>
