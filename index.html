<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Passcode ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff4d8d,#ff758c,#ff9a9e);
padding:20px;
}

.container{
background:white;
padding:25px;
border-radius:25px;
display:flex;
gap:30px;
flex-wrap:wrap;
justify-content:center;
align-items:center;
box-shadow:0 0 30px rgba(0,0,0,.2);
max-width:900px;
width:100%;
}

.photo-box{
text-align:center;
}

.photo-box img{
width:280px;
height:350px;
object-fit:cover;
border-radius:15px;
border:8px solid white;
box-shadow:0 0 20px rgba(0,0,0,.15);
}

.photo-box h2{
margin-top:15px;
color:#ff4d8d;
}

.passcode{
text-align:center;
}

.passcode h3{
margin-bottom:20px;
color:#444;
}

.display{
display:flex;
justify-content:center;
gap:10px;
margin-bottom:20px;
}

.dot{
width:18px;
height:18px;
border-radius:50%;
border:2px solid #ff4d8d;
}

.filled{
background:#ff4d8d;
}

.keypad{
display:grid;
grid-template-columns:repeat(3,70px);
gap:10px;
justify-content:center;
}

.key{
width:70px;
height:70px;
border:none;
border-radius:50%;
font-size:22px;
background:#ffe1eb;
cursor:pointer;
}

.key:hover{
background:#ffb6cc;
}

.enter-btn{
margin-top:20px;
padding:12px 30px;
border:none;
border-radius:30px;
background:#ff4d8d;
color:white;
font-size:18px;
cursor:pointer;
}

#error{
margin-top:15px;
color:red;
}

@media(max-width:768px){

.photo-box img{
width:220px;
height:280px;
}

}

</style>
</head>
<body>

<div class="container">

<div class="photo-box">

<img src="image/photo5.jpg" alt="Birthday Photo">
<h2>Happy Birthday Darling ❤️</h2>

</div>

<div class="passcode">

<h3>Enter Passcode 🔐</h3>

<div class="display">
<div class="dot" id="d1"></div>
<div class="dot" id="d2"></div>
<div class="dot" id="d3"></div>
<div class="dot" id="d4"></div>
</div>

<div class="keypad">

<button class="key" onclick="addNum('1')">1</button>
<button class="key" onclick="addNum('2')">2</button>
<button class="key" onclick="addNum('3')">3</button>

<button class="key" onclick="addNum('4')">4</button>
<button class="key" onclick="addNum('5')">5</button>
<button class="key" onclick="addNum('6')">6</button>

<button class="key" onclick="addNum('7')">7</button>
<button class="key" onclick="addNum('8')">8</button>
<button class="key" onclick="addNum('9')">9</button>

<button class="key" onclick="clearPin()">⌫</button>
<button class="key" onclick="addNum('0')">0</button>
<button class="key" onclick="checkPin()">✓</button>

</div>

<p id="error"></p>

</div>

</div>

<script>

let pin="";

function addNum(num){

if(pin.length<4){

pin+=num;

document.getElementById("d"+pin.length)
.classList.add("filled");

}

}

function clearPin(){

pin="";

for(let i=1;i<=4;i++){

document.getElementById("d"+i)
.classList.remove("filled");

}

}

function checkPin(){

if(pin==="0306"){

window.location.href="gift.html";

}else{

document.getElementById("error")
.innerHTML="❌ Wrong Passcode";

clearPin();

}

}

</script>

</body>
</html>
