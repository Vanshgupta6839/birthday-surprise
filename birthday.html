<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Darling ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);
overflow:hidden;
color:white;
text-align:center;
}

h1{
font-size:5rem;
animation:glow 2s infinite alternate;
}

h2{
font-size:2rem;
margin-top:15px;
color:#ff8ed2;
}

p{
margin-top:20px;
font-size:1.3rem;
}

button{
margin-top:40px;
padding:15px 40px;
border:none;
border-radius:50px;
background:#ff4da6;
color:white;
font-size:18px;
cursor:pointer;
box-shadow:0 0 20px #ff4da6;
transition:.3s;
}

button:hover{
transform:scale(1.08);
}

.balloon{
position:absolute;
bottom:-150px;
font-size:40px;
animation:floatUp linear infinite;
}

@keyframes floatUp{

0%{
transform:translateY(0);
}

100%{
transform:translateY(-120vh);
}

}

@keyframes glow{

from{
text-shadow:0 0 10px #ff4da6;
}

to{
text-shadow:0 0 40px #ff4da6;
}

}

</style>
</head>

<body>

<h1>🎂 Happy Birthday</h1>

<h2>Param Mitra ❤️</h2>

<h2>(Darling)</h2>

<p>
Today Is All About You ✨
</p>

<button onclick="nextPage()">
View Memory →
</button>

<script>

function nextPage(){

window.location.href="memory1.html";

}

for(let i=0;i<20;i++){

let balloon=document.createElement("div");

balloon.className="balloon";

balloon.innerHTML=["🎈","🎈","🎈","🎉"][Math.floor(Math.random()*4)];

balloon.style.left=Math.random()*100+"%";

balloon.style.animationDuration=
(Math.random()*5+5)+"s";

document.body.appendChild(balloon);

}

</script>

</body>
</html>
