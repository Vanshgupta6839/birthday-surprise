<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Darling ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);
padding:20px;
overflow-y:auto;
color:white;
}

.container{
width:100%;
max-width:1000px;
display:flex;
flex-wrap:wrap;
justify-content:center;
align-items:center;
gap:40px;
}

.photo{
text-align:center;
}

.photo img{
width:320px;
height:420px;
object-fit:cover;
border-radius:25px;
border:6px solid white;
box-shadow:0 0 30px rgba(255,255,255,.2);
}

.content{
text-align:center;
max-width:450px;
}

h1{
font-size:4rem;
animation:glow 2s infinite alternate;
}

h2{
font-size:2rem;
margin-top:15px;
color:#ff8ed2;
}

p{
margin-top:20px;
font-size:1.2rem;
line-height:1.8;
}

button{
margin-top:35px;
padding:15px 35px;
border:none;
border-radius:50px;
background:#ff4da6;
color:white;
font-size:18px;
cursor:pointer;
box-shadow:0 0 20px #ff4da6;
}

button:hover{
transform:scale(1.08);
}

.balloon{
position:fixed;
bottom:-100px;
font-size:40px;
animation:floatUp linear infinite;
pointer-events:none;
}

@keyframes floatUp{

0%{
transform:translateY(0);
}

100%{
transform:translateY(-120vh);
}

}

@keyframes glow{

from{
text-shadow:0 0 10px #ff4da6;
}

to{
text-shadow:0 0 40px #ff4da6;
}

}

@media(max-width:768px){

.photo img{
width:250px;
height:320px;
}

h1{
font-size:2.5rem;
}

h2{
font-size:1.5rem;
}

p{
font-size:1rem;
}

button{
width:90%;
max-width:280px;
}

}

</style>

</head>

<body>

<div class="container">

<div class="photo">

<img src="image/photo1.jpg" alt="Birthday Photo">

</div>

<div class="content">

<h1>🎂 Happy Birthday</h1>

<h2>Param Mitra ❤️</h2>

<h2>(Darling)</h2>

<p>
Today Is All About You ✨
<br>
May Your Smile Always Stay Beautiful ❤️
</p>

<button onclick="nextPage()">
View Memory →
</button>

</div>

</div>

<script>

function nextPage(){

window.location.href="memory1.html";

}

for(let i=0;i<20;i++){

let balloon=document.createElement("div");

balloon.className="balloon";

balloon.innerHTML=["🎈","🎉","🎈","✨"][Math.floor(Math.random()*4)];

balloon.style.left=Math.random()*100+"%";

balloon.style.animationDuration=
(Math.random()*5+5)+"s";

document.body.appendChild(balloon);

}

</script>

</body>
</html>
